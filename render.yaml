databases:
  - name: knowledge-base-postgres
    databaseName: kb_agent
    user: postgres
    plan: free
    region: oregon

services:
  - type: web
    name: knowledge-base-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --prefer-binary -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT app.main:app"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CARGO_HOME
        value: /opt/render/project/src/.cargo
      - key: APP_NAME
        value: FlytBase Knowledge Intelligence
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATASET_DIR
        value: se-dataset
      - key: VECTOR_STORE
        value: qdrant
      - key: NEO4J_HOST
        fromService:
          name: neo4j
          type: pserv
          property: host
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: Neo4jSecure2024!
      - key: NEO4J_DATABASE
        value: neo4j
      - key: QDRANT_HOST
        fromService:
          name: qdrant
          type: pserv
          property: host
      - key: QDRANT_API_KEY
        fromService:
          name: qdrant
          type: pserv
          envVarKey: QDRANT__SERVICE__API_KEY
      - key: QDRANT_COLLECTION
        value: kb_agent_chunks
      - key: POSTGRES_DSN
        fromDatabase:
          name: knowledge-base-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBED_MODEL
        value: embed-english-v3.0
      - key: EMBEDDING_DIM
        value: "1024"
      - key: LIVE_DOCS_ALLOWED_HOSTS
        value: docs.flytbase.com,releases.flytbase.com
      - key: LIVE_FETCH_TIMEOUT_SECONDS
        value: "12"
      - key: LIVE_MAX_PAGES
        value: "6"
      - key: GRAPH_TOP_K
        value: "10"
      - key: VECTOR_TOP_K
        value: "8"
      - key: EVIDENCE_TOP_K
        value: "8"

  - type: pserv
    name: qdrant
    runtime: image
    image: qdrant/qdrant:v1.11.5
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10
    envVars:
      - key: QDRANT__SERVICE__API_KEY
        generateValue: true

  - type: pserv
    name: neo4j
    runtime: image
    image: neo4j:5.23-community
    plan: starter
    region: oregon
    disk:
      name: neo4j-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NEO4J_AUTH
        value: neo4j/Neo4jSecure2024!
      - key: NEO4J_PLUGINS
        value: '["apoc"]'
